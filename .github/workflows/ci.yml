name: Python CI

on:
  push:
    branches:
      - main
      - development
      - feature/*
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pytest pytest-cov pylint ruff

      - name: Ruff Check
        run: |
          ruff check .

      - name: Pylint
        run: |
          pylint src || true

      - name: Run Tests
        run: |
          pytest tests/ \
          --cov=src \
          --cov-report=term-missing \
          --cov-report=xml

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml